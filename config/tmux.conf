# ~/.tmux.conf — tuned for attaching from an iPhone (Blink Shell) over Tailscale.
#
# Goals: large scrollback, mouse/touch friendly, readable status bar, and
# resilient to the small/changing screen size of a phone in landscape.

# ---------------------------------------------------------------------------
# Core
# ---------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor

# Bigger prefix target is easier on a touch keyboard: Ctrl-a (screen-style).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 100000                  # generous scrollback for review on a small screen
set -sg escape-time 10                       # snappier key handling over latency
set -g focus-events on
setw -g aggressive-resize on                 # resize to the smallest *attached* client cleanly

# Start window/pane numbering at 1 — fewer reaches on a phone keyboard.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------------------
# Touch / mouse
# ---------------------------------------------------------------------------

set -g mouse on                              # tap to select panes, drag to resize, scroll to scrollback

# ---------------------------------------------------------------------------
# Mobile-friendly keybindings
# ---------------------------------------------------------------------------

# Reload config without restarting.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Split using visual, easy-to-remember keys; open in the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (works well with Blink's hardware-key mappings).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick detach is the move you make most on a phone — keep it on the prefix.
bind d detach-client

# ---------------------------------------------------------------------------
# Status bar — compact and legible on a phone screen
# ---------------------------------------------------------------------------

set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=colour234,fg=colour250"
set -g status-left "#[bg=colour39,fg=colour234,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour245]#H #[fg=colour39]%H:%M "
set -g status-right-length 40

setw -g window-status-current-style "bg=colour39,fg=colour234,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Keep panes visible when one disconnects; brighten the active pane border.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
